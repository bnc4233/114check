name: Keep Render & Supabase Alive

on:
  schedule:
    # Runs every 3 days at 00:00 UTC to keep free-tier Supabase active (7-day inactivity limit)
    - cron: '0 0 */3 * *'
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Server /ping Endpoint (if configured)
        env:
          PING_URL: ${{ secrets.PING_URL }}
        run: |
          if [ -n "$PING_URL" ]; then
            echo "Pinging $PING_URL..."
            curl -fsSL "$PING_URL" || true
          else
            echo "PING_URL secret not configured. Skipping."
          fi

      - name: Ping Supabase REST API (if configured)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ]; then
            echo "Pinging Supabase REST endpoint..."
            curl -fsSL -X GET "${SUPABASE_URL}/rest/v1/visitor_logs?select=id&limit=1" \
              -H "apikey: ${SUPABASE_ANON_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" || true
          else
            echo "Supabase secrets not configured. Skipping."
          fi
